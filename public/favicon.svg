<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Core Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Arrow Peak Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="8" />

  <!-- Outer Glowing Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-dasharray="800 200" stroke-linecap="round" filter="url(#glow)" opacity="0.9" />

  <!-- Daily Tracker Grid Matrix Dots -->
  <g fill="rgba(255, 255, 255, 0.25)">
    <circle cx="176" cy="180" r="12" />
    <circle cx="256" cy="180" r="12" />
    <circle cx="336" cy="180" r="12" fill="#10b981" filter="url(#subtleGlow)" />

    <circle cx="176" cy="256" r="12" fill="#6366f1" filter="url(#subtleGlow)" />
    <circle cx="256" cy="256" r="16" fill="#a855f7" filter="url(#glow)" />
    <circle cx="336" cy="256" r="12" />

    <circle cx="176" cy="332" r="12" fill="#38bdf8" />
    <circle cx="256" cy="332" r="12" />
    <circle cx="336" cy="332" r="12" fill="#10b981" />
  </g>

  <!-- Rising Dynamic Pulse Arrow Line -->
  <path d="M 150 330 L 220 270 L 270 300 L 362 170" fill="none" stroke="url(#arrowGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Arrowhead Pointer -->
  <path d="M 320 170 L 362 170 L 362 212" fill="none" stroke="url(#arrowGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Sparkling Success Star -->
  <path d="M 380 130 L 386 146 L 402 152 L 386 158 L 380 174 L 374 158 L 358 152 L 374 146 Z" fill="#f59e0b" filter="url(#glow)" />
</svg>