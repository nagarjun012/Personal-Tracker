<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Main Rounded Hexagon Badge -->
  <rect x="8" y="8" width="84" height="84" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Outer Aura Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" stroke-dasharray="8 4" />
  
  <!-- Sleek Pulse / Emblem Path -->
  <path d="M 32 62 L 43 38 L 51 52 L 58 43 L 68 62" fill="none" stroke="url(#glowGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Sparkle Nodes -->
  <circle cx="58" cy="43" r="3.5" fill="#ffffff" />
  <circle cx="68" cy="62" r="4" fill="#ffffff" />
  <circle cx="32" cy="62" r="4" fill="#ffffff" />
</svg>